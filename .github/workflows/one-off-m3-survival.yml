name: One-off public CAPN1 survival reconstruction
on:
  push:
    branches: [feat/m3-survival-reconstruction]
permissions:
  contents: read
jobs:
  m3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version
      - name: Test M1 M2 and M3 invariants
        run: |
          pnpm test
          node --test .dsh/skills/capn1-aml-public-reconstruction/tests/m3-cohort.test.mjs
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Verify R survival runtime
        run: |
          Rscript -e 'if (!requireNamespace("survival", quietly=TRUE)) install.packages("survival", repos="https://cloud.r-project.org"); stopifnot(requireNamespace("survival", quietly=TRUE)); cat(R.version.string, "survival:", as.character(packageVersion("survival")), "\n")'
      - name: Acquire source and prepare matrices (public GDC only)
        run: |
          for attempt in 1 2 3; do
            if pnpm run data:prepare; then exit 0; fi
            echo "Public GDC acquisition failed attempt ${attempt}; resuming compatible partial cache..."
            sleep 15
          done
          exit 1
      - name: Build auditable provisional cohort
        run: |
          node .dsh/skills/capn1-aml-public-reconstruction/scripts/m3-cohort.mjs --workspace research-workspace > /tmp/m3-run.json
          cat /tmp/m3-run.json
          node -e "process.stdout.write('RUN_DIR=' + JSON.parse(require('fs').readFileSync('/tmp/m3-run.json','utf8')).directory + '\n')" >> "$GITHUB_ENV"
      - name: Run provisional R Kaplan-Meier and Cox
        run: |
          Rscript .dsh/skills/capn1-aml-public-reconstruction/scripts/m3-survival.R "$RUN_DIR"
          test -f "$RUN_DIR/provisional-results.tsv"
          cat "$RUN_DIR/provisional-results.tsv"
      - name: Stage public small research evidence
        if: success()
        run: |
          mkdir -p m3-artifacts
          cp "$RUN_DIR/"{candidate-cohort.tsv,cohort-audit.tsv,manifest.json,provisional-results.tsv,provisional-report.md,provisional-kaplan-meier.png,provisional-analysis-cohort.tsv} m3-artifacts/
          node -e "let s=require('fs').readFileSync('research-workspace/study/processed.json','utf8');let j=JSON.parse(s);require('fs').writeFileSync('m3-artifacts/input-processed-lineage.json',JSON.stringify({source_snapshot:j.source_snapshot,source_digest:j.source_digest,run:j.id,runtime:j.runtime},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-capn1-m3-provisional
          path: m3-artifacts/
          if-no-files-found: warn
          retention-days: 14
