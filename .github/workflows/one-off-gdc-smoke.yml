name: One-off CAPN1 public sandbox smoke

on:
  push:
    branches: [sandbox/20261009-public-gdc-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Match DSH package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version
      - name: Verify source and processing tests
        run: pnpm test
      - name: Check launcher
        run: |
          pnpm run doctor
          pnpm run web --dry-run
      - name: Verify official DSH CLI
        run: timeout 120s pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 --version
      - name: Real research-web profile deployment
        run: |
          pnpm run deploy:web
          pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 --profile research-web --dump-config > /tmp/research-profile.yml
          grep -n 'skill-filesystem' /tmp/research-profile.yml
      - name: Verify research bundle activation with external workspace
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { homedir } from 'node:os'
          import { join } from 'node:path'
          const pkg = JSON.parse(await readFile(join(homedir(), '.dsh/profiles/research-web/package.json'), 'utf8'))
          console.log('Profile bundle list:', pkg.dsh?.profile?.bundles)
          console.log('Profile dependency:', pkg.dependencies?.['dsh-medical-research-skill-pack'])
          NODE
          DSH_MED_RESEARCH_SKILL_ROOT="$GITHUB_WORKSPACE/.dsh/skills" pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 --profile research-web --dump-config > /tmp/active-research-profile.yml
          grep -n -C 3 'DSH_MED_RESEARCH_SKILL_ROOT' /tmp/active-research-profile.yml
