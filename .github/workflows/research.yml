name: CAPN1 M1-M5 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Ensure survival is available
        run: Rscript -e 'if (!requireNamespace("survival", quietly=TRUE)) install.packages("survival", repos="https://cloud.r-project.org")'
      - name: Install Bioconductor DESeq2
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'if (!requireNamespace("DESeq2", quietly=TRUE)) BiocManager::install("DESeq2", ask=FALSE, update=FALSE, quiet=TRUE); stopifnot(requireNamespace("DESeq2", quietly=TRUE))'
      - name: Install GO/KEGG enrichment dependencies
        run: |
          Rscript -e 'BiocManager::install(c("clusterProfiler", "org.Hs.eg.db"), ask=FALSE, update=FALSE, quiet=TRUE); stopifnot(requireNamespace("clusterProfiler", quietly=TRUE),requireNamespace("org.Hs.eg.db", quietly=TRUE))'
      - name: Deterministic M1-M5 tests, including offline KEGG and real R enrichment
        run: pnpm test
