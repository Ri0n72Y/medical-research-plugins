name: CAPN1 Python M1-M10 checks

on:
  pull_request:
  push:
    branches: [main, 'sandbox/full-run-*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python statistical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c 'import lifelines, pydeseq2, scipy, statsmodels, pandas, networkx, gseapy; print("Python research dependencies ready")'
      - name: Deterministic M1-M10 tests with Python scientific libraries
        run: pnpm test
      # Explicit one-branch online acceptance requested by the researcher. No new workflow.
      - name: Online TCGA-LAML public-data M1-M5 reconstruction
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        timeout-minutes: 50
        env:
          STUDY_DIR: ${{ runner.temp }}/tcga-laml-study
        run: |
          pnpm run data:prepare --workspace "$STUDY_DIR"
          pnpm run survival --workspace "$STUDY_DIR"
          pnpm run deg --workspace "$STUDY_DIR"
          pnpm run enrichment --workspace "$STUDY_DIR"
      - name: Collect public demonstration reports
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        env:
          STUDY_DIR: ${{ runner.temp }}/tcga-laml-study
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['STUDY_DIR'])
          output = pathlib.Path('public-demo-output')
          output.mkdir(exist_ok=True)
          for stage, label in [('processed','M2'),('survival','M3'),('deg','M4'),('enrichment','M5')]:
              p = root / 'study' / (stage + '.json')
              if not p.is_file():
                  continue
              manifest = json.loads(p.read_text())
              shutil.copyfile(p, output / (label + '-manifest.json'))
              for item in manifest.get('outputs', []):
                  src = root / item['path']
                  if src.is_file() and src.name in ('report.md', 'qc.md', 'statistics.tsv', 'enrichment-top.svg', 'kaplan-meier.svg', 'volcano.svg'):
                      shutil.copyfile(src, output / (label + '-' + src.name))
          PY
      - name: Upload public research summaries
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        uses: actions/upload-artifact@v4
        with:
          name: capn1-m1-m5-public-demo
          path: public-demo-output/
          if-no-files-found: warn
          retention-days: 14

      # Branch-only acceptance: real public sources and M1–M11, never merged to main.
      - name: Sandbox full public M1-M11 acceptance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/sandbox/full-run-')
        timeout-minutes: 130
        run: python3 scripts/sandbox-e2e.py
      - name: Upload sandbox acceptance evidence
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/sandbox/full-run-')
        uses: actions/upload-artifact@v4
        with:
          name: capn1-full-sandbox-evidence
          path: sandbox-evidence/
          if-no-files-found: warn
          retention-days: 14
