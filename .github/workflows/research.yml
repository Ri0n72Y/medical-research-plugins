name: CAPN1 M1-M5 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Ensure survival is available
        run: Rscript -e 'if (!requireNamespace("survival", quietly=TRUE)) install.packages("survival", repos="https://cloud.r-project.org")'
      - name: Install Bioconductor DESeq2
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'if (!requireNamespace("DESeq2", quietly=TRUE)) BiocManager::install("DESeq2", ask=FALSE, update=FALSE, quiet=TRUE); stopifnot(requireNamespace("DESeq2", quietly=TRUE))'
      - name: Install GO/KEGG enrichment dependencies
        run: |
          # enrichplot imports CRAN ggtangle, which should be installed after its Bioconductor dependencies.
          # Keep verbose installation logs: a failure must identify the actual package, not just its dependents.
          Rscript -e 'BiocManager::install(c("ggfun", "yulab.utils", "ggtree"), ask=FALSE, update=FALSE)'
          Rscript -e 'install.packages("ggtangle", repos="https://cloud.r-project.org"); stopifnot(requireNamespace("ggtangle", quietly=TRUE))'
          Rscript -e 'BiocManager::install(c("clusterProfiler", "org.Hs.eg.db"), ask=FALSE, update=FALSE); stopifnot(requireNamespace("clusterProfiler", quietly=TRUE),requireNamespace("org.Hs.eg.db", quietly=TRUE))'
      - name: Deterministic M1-M5 tests, including offline KEGG and real R enrichment
        run: pnpm test
      # Explicit one-branch online acceptance requested by the researcher. No new workflow.
      - name: Online TCGA-LAML public-data M1-M5 reconstruction
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        timeout-minutes: 50
        env:
          STUDY_DIR: ${{ runner.temp }}/tcga-laml-study
        run: |
          pnpm run data:prepare --workspace "$STUDY_DIR"
          pnpm run survival --workspace "$STUDY_DIR"
          pnpm run deg --workspace "$STUDY_DIR"
          pnpm run enrichment --workspace "$STUDY_DIR"
      - name: Collect public demonstration reports
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        env:
          STUDY_DIR: ${{ runner.temp }}/tcga-laml-study
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['STUDY_DIR'])
          output = pathlib.Path('public-demo-output')
          output.mkdir(exist_ok=True)
          for stage, label in [('processed','M2'),('survival','M3'),('deg','M4'),('enrichment','M5')]:
              p = root / 'study' / (stage + '.json')
              if not p.is_file():
                  continue
              manifest = json.loads(p.read_text())
              shutil.copyfile(p, output / (label + '-manifest.json'))
              for item in manifest.get('outputs', []):
                  src = root / item['path']
                  if src.is_file() and src.name in ('report.md', 'qc.md', 'statistics.tsv', 'enrichment-top.svg', 'kaplan-meier.svg', 'volcano.svg'):
                      shutil.copyfile(src, output / (label + '-' + src.name))
          PY
      - name: Upload public research summaries
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/m5-go-kegg-enrichment'
        uses: actions/upload-artifact@v4
        with:
          name: capn1-m1-m5-public-demo
          path: public-demo-output/
          if-no-files-found: warn
          retention-days: 14
