decisions:
  D1:
    name: CAPN1 high / low grouping
    status: demo-default
    proposed_default: median
    selected: median
    source: conventional-demo-default
    rationale: M3 uses median TPM of paired eligible cases, not the unknown original cutoff.

  D2:
    name: multivariable survival covariates
    status: demo-default
    proposed_default: no-multivariable-model
    selected: no-multivariable-model
    source: conventional-demo-default
    rationale: M3 is unadjusted Cox; adjusted models require declared covariates.

  D3:
    name: DEG threshold
    status: demo-default
    proposed_default:
      fdr_lt: 0.05
      abs_log2fc_gte: 1
    selected:
      fdr_lt: 0.05
      abs_log2fc_gte: 1
    source: conventional-demo-default
    rationale: Declared post-test screening, not a test of fold change above a threshold.

  D4:
    name: STRING confidence
    status: unresolved
    proposed_default: 400
    selected: null
    source: researcher
    rationale: null

  D5:
    name: immune deconvolution path
    status: unresolved
    proposed_default: ssgsea-only
    allowed:
      - ssgsea-only
      - public-substitute
      - user-supplied-cibersort
      - skip-deconvolution
    selected: null
    source: researcher
    rationale: null
